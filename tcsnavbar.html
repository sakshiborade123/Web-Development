<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TCS Navbar</title>
  <link rel="stylesheet" href="./tcsnavbar.css">

</head>
<body>

<header class="tcs-header">
  <div class="tcs-logo">
    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/Tata_Consultancy_Services_Logo.svg" alt="TCS Logo">
  </div>

  <nav class="tcs-nav">
    <a href="#">What we do</a>
    <a href="#">Industries</a>

  <div class="tcs-icons">

</header>

</body>
</html>
