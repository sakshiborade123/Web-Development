<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Header</title>
    <link rel="stylesheet" href="./ts.css">
</head>
<body>
    <header id="header">
        <div id="header-container">

            <div id="Logo">FLIPKART

                <span>Explore Plus</span>
            </div>

            <div id="Search-box">
                <input type="text" placeholder="Search for Product">
                <span id="search-icon"></span>
            </div>


            <div id="login-btn">Login</div>

            <div id="nav-link"> Become a Seller</div>
            <div id="nav-link">More</div>

            <div id="Cart">Cart</div>


        </div>
    </header>

    
</body>
</html>
